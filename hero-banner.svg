<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" style="background:linear-gradient(135deg,#08080F,#0F0F1A);border-radius:18px">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="480" cy="60" r="90" fill="#6C5CE7" opacity="0.06"><animate attributeName="r" values="90;100;90" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="250" r="60" fill="#A855F7" opacity="0.04"><animate attributeName="r" values="60;70;60" dur="7s" repeatCount="indefinite"/></circle>
  
  <!-- Gear icon -->
  <g transform="translate(90,150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#6C5CE7" opacity="0.6"/>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(160,150)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#6C5CE7" stroke-width="1.5" opacity="0.5">
      <animate attributeName="x2" values="0;60;0" dur="3s" repeatCount="indefinite"/>
    </line>
    <polygon points="40,-4 44,0 40,4" fill="#6C5CE7" opacity="0.5">
      <animate attributeName="points" values="40,-4 44,0 40,4;60,-4 64,0 60,4;40,-4 44,0 40,4" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Sparkle -->
  <g transform="translate(240,150)">
    <circle cx="0" cy="0" r="3" fill="#A855F7"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="3" fill="#A855F7"><animate attributeName="opacity" values="0;0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Checkmark -->
  <g transform="translate(300,150)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#10B981" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="14;18;14" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M-6,0 L-2,5 L8,-5" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <text x="300" y="230" text-anchor="middle" fill="#F1F1FA" font-family="Inter,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
    One process<tspan fill="url(#bg)">.</tspan>
  </text>
  <text x="300" y="258" text-anchor="middle" fill="#A855F7" font-family="Inter,sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    Automated in 48 hours.
  </text>
  <text x="300" y="282" text-anchor="middle" fill="#5C5C80" font-family="Inter,sans-serif" font-size="11">
    AI Automation Sprint — $497 flat fee
  </text>
</svg>