<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" style="background:#08080F;border-radius:18px;width:100%;max-width:800px">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/><stop offset="100%" stop-color="#A855F7"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7"/><stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#F1F1FA" font-family="Inter,sans-serif" font-size="14" font-weight="600" opacity="0">
    How it works
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze"/>
  </text>
  
  <!-- Step 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.1;0.2"/>
    <circle cx="100" cy="100" r="28" fill="url(#g)" opacity="0.15"/>
    <circle cx="100" cy="100" r="22" fill="none" stroke="#6C5CE7" stroke-width="1.5" opacity="0.6"/>
    <text x="100" y="106" text-anchor="middle" fill="#A855F7" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700">1</text>
    <text x="100" y="150" text-anchor="middle" fill="#9494B8" font-family="Inter,sans-serif" font-size="11">You describe</text>
    <text x="100" y="166" text-anchor="middle" fill="#5C5C80" font-family="Inter,sans-serif" font-size="9">the process</text>
  </g>
  
  <!-- Arrow 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;0.25;0.3"/>
    <line x1="135" y1="100" x2="190" y2="100" stroke="#6C5CE7" stroke-width="1" opacity="0.4"/>
    <polygon points="190,96 198,100 190,104" fill="#6C5CE7" opacity="0.4"/>
  </g>
  
  <!-- Step 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.3;0.35;0.45"/>
    <circle cx="270" cy="100" r="28" fill="url(#g)" opacity="0.15"/>
    <circle cx="270" cy="100" r="22" fill="none" stroke="#6C5CE7" stroke-width="1.5" opacity="0.6"/>
    <text x="270" y="106" text-anchor="middle" fill="#A855F7" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700">2</text>
    <text x="270" y="150" text-anchor="middle" fill="#9494B8" font-family="Inter,sans-serif" font-size="11">We audit</text>
    <text x="270" y="166" text-anchor="middle" fill="#5C5C80" font-family="Inter,sans-serif" font-size="9">&amp; plan</text>
  </g>
  
  <!-- Arrow 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.4;0.45;0.5;0.55"/>
    <line x1="305" y1="100" x2="360" y2="100" stroke="#6C5CE7" stroke-width="1" opacity="0.4"/>
    <polygon points="360,96 368,100 360,104" fill="#6C5CE7" opacity="0.4"/>
  </g>
  
  <!-- Step 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.4;0.5;0.55;0.6;0.65;0.75"/>
    <circle cx="440" cy="100" r="28" fill="url(#g)" opacity="0.15"/>
    <circle cx="440" cy="100" r="22" fill="none" stroke="#6C5CE7" stroke-width="1.5" opacity="0.6"/>
    <text x="440" y="106" text-anchor="middle" fill="#A855F7" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700">3</text>
    <text x="440" y="150" text-anchor="middle" fill="#9494B8" font-family="Inter,sans-serif" font-size="11">We build it</text>
    <text x="440" y="166" text-anchor="middle" fill="#5C5C80" font-family="Inter,sans-serif" font-size="9">in 48 hours</text>
  </g>
  
  <!-- Arrow 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;0;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.6;0.65;0.7;0.75;0.8;0.85"/>
    <line x1="475" y1="100" x2="530" y2="100" stroke="#6C5CE7" stroke-width="1" opacity="0.4"/>
    <polygon points="530,96 538,100 530,104" fill="#6C5CE7" opacity="0.4"/>
  </g>
  
  <!-- Step 4 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;0;0;1" dur="8s" repeatCount="indefinite" keyTimes="0;0.6;0.7;0.75;0.8;0.85;0.9;0.95;1"/>
    <circle cx="610" cy="100" r="28" fill="#10B981" opacity="0.12"/>
    <circle cx="610" cy="100" r="22" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
    <text x="610" y="106" text-anchor="middle" fill="#10B981" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700">4</text>
    <text x="610" y="150" text-anchor="middle" fill="#9494B8" font-family="Inter,sans-serif" font-size="11">You're live</text>
    <text x="610" y="166" text-anchor="middle" fill="#5C5C80" font-family="Inter,sans-serif" font-size="9">with support</text>
  </g>
</svg>